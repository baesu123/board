server:
  port: 8080

spring:
  application:
    name: board

  datasource:
    #Mysql DB 설정
    url: jdbc:mysql://localhost:3306/board?serverTimezone=Asia/Seoul
    username: root
    password: 1234

#    url: jdbc:h2:file:~/testdb;DB_CLOSE_DELAY=-1
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    username: sa
#    password:

  # ===== H2 인메모리 DB 설정 (초보자용) =====
  # MySQL로 전환하려면 아래 4줄을 MySQL 설정으로 교체하고
  # build.gradle 의 h2 의존성을 mysql-connector-j 로 변경하세요.
#  h2:
#    console:
#      enabled: true
#      path: /h2-console  # 브라우저에서 http://localhost:8080/h2-console 접속 가능

  sql:
    init:
      mode: never  # 매번 실행 시 schema.sql / data.sql 자동 실행

# ===== MyBatis 설정 =====
mybatis:
  mapper-locations: classpath:mapper/**/*.xml   # XML 매퍼 위치
  type-aliases-package: com.example.board.domain # alias로 쓸 도메인 패키지
  configuration:
    map-underscore-to-camel-case: true  # DB(snake_case) <-> Java(camelCase) 자동 매핑

# 로그에서 SQL 쿼리 확인하고 싶을 때
logging:
  level:
    com.example.board.mapper: trace

# ===== JWT 설정 =====
jwt:
  # 반드시 32바이트(256bit) 이상의 무작위 문자열이어야 함 (HS256 알고리즘 요구사항)
  # 운영 환경에서는 코드에 직접 넣지 말고 환경변수(JWT_SECRET)로 주입할 것
  secret: ${JWT_SECRET:this-is-a-very-long-development-only-secret-key-please-change-in-production-1234567890}
  expiration: 3600000        # Access Token 만료시간 (ms) - 1시간
  